              private void drawFactoryChargeBase(Canvas canvas) {
                  if (difficulty != Difficulty.HARD) return;
                  float x = gx(factoryBaseX);
                  float y = gy(factoryBaseY);
                  int active = factoryReturningToCharge ? 1 : factoryCharging ? 2 : 0;
