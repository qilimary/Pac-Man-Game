                  canvas.drawCircle(x + r * 0.27f, y - r * 0.13f, r * 0.20f, paint);
                  paint.setColor(0xFF22202C);
                  canvas.drawCircle(x - r * 0.24f, y - r * 0.10f, r * 0.08f, paint);
                  canvas.drawCircle(x + r * 0.30f, y - r * 0.10f, r * 0.08f, paint);
